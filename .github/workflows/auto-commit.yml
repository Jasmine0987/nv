
name: Daily Auto Commits

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "yourusername"
          git config --global user.email "89407304+Jasmine0987@users.noreply.github.com"

      - name: Make random number of commits
        run: |
          mkdir -p daily-log

          DAY=$(date -u +%u)

          # Usually 1–9 commits; 10–15 on 1–2 days weekly
          if [ "$DAY" -eq 2 ] || [ "$DAY" -eq 5 ]; then
            COMMIT_COUNT=$(( (RANDOM % 6) + 10 ))
          else
            COMMIT_COUNT=$(( (RANDOM % 9) + 1 ))
          fi

          echo "Making $COMMIT_COUNT commits today"

          for i in $(seq 1 "$COMMIT_COUNT"); do
            QUOTE=$(curl -fsS --max-time 10 \
              https://api.quotable.io/random |
              jq -r '.content + " — " + .author' 2>/dev/null || true)

            if [ -z "$QUOTE" ] || [ "$QUOTE" = "null — null" ]; then
              QUOTE="Entry $i — $(date -u +"%Y-%m-%d %H:%M:%S")"
            fi

            echo "$(date -u +"%Y-%m-%d %H:%M:%S") | $QUOTE" \
              >> "daily-log/$(date -u +"%Y-%m-%d").md"

            git add daily-log/

            git commit -m "log: entry $i for $(date -u +"%Y-%m-%d")"

            SLEEP_TIME=$(( RANDOM % 30 ))
            sleep "$SLEEP_TIME"
          done

      - name: Push all commits
        run: git push
